<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المنتج | بحرنا وشراعنا</title>
<link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="app.js"></script></head><body>
<div class="topbar"><div class="container">🇦🇪 الإمارات • AED • Pilot</div></div>
<header class="header"><div class="container header-row"><a class="brand" href="home.html"><span class="brand-mark">⛵🐟</span><div>بحرنا وشراعنا<br><small>BAHRNA & SHRAANA</small></div></a><div style="margin-right:auto"><a class="btn btn-gold" href="catalog.html">السوق</a></div></div></header>
<section class="section"><div class="container grid2">
<div class="heroimg">🐟</div>
<div class="card">
<span class="badge" id="originBadge">منتج طازج</span>
<h1 id="productName">جاري تحميل المنتج...</h1>
<p class="muted" id="productMeta"></p>
<div class="price"><span id="unitPrice">AED —</span> <small style="font-size:14px">/ كجم</small></div>
<div class="field"><label>الوزن</label><select id="w" onchange="calc()"><option value="1">1 كجم</option><option value="2">2 كجم</option><option value="3">3 كجم</option><option value="5">5 كجم</option></select></div>
<div class="row"><strong>الإجمالي:</strong><span id="total" class="price">AED —</span></div>
<div class="row" style="margin-top:14px"><button class="btn btn-primary" onclick="startCheckout()">إتمام الشراء</button><button class="btn btn-ghost">حفظ</button></div>
<p class="muted" style="font-size:12px;margin-top:16px">سيتم اختيار طريقة التنظيف والتقطيع والتغليف في الخطوة التالية.</p>
</div></div></section>
<section class="section"><div class="container"><div class="grid3"><div class="kpi"><strong id="stockKpi">—</strong><span>المخزون المتاح</span></div><div class="kpi"><strong>✓</strong><span>سعر موحد لكل كجم</span></div><div class="kpi"><strong id="supplierKpi">—</strong><span>المورد</span></div></div></div></section>
<script>
let selected=null;
function money(n){return 'AED '+Number(n).toFixed(2)}
async function loadProduct(){
 try{selected=JSON.parse(localStorage.getItem('selectedOffer')||'null')}catch(e){}
 if(!selected){const offers=await Bahrna.getMarketOffers();selected=offers[0]||null}
 if(!selected){document.getElementById('productName').textContent='المنتج غير متوفر';return}
 document.getElementById('productName').textContent=selected.name;
 document.getElementById('originBadge').textContent=selected.origin||'منتج طازج';
 document.getElementById('productMeta').textContent=(selected.supplier||'مورد موثق')+' • متوفر '+selected.qty+' كجم';
 document.getElementById('unitPrice').textContent=money(selected.retail);
 document.getElementById('stockKpi').textContent=selected.qty+' كجم';
 document.getElementById('supplierKpi').textContent=selected.supplier||'مورد موثق';
 calc();
}
function calc(){if(!selected)return;const q=Number(document.getElementById('w').value);document.getElementById('total').textContent=money(selected.retail*q)}
function startCheckout(){
 if(!selected)return;
 const qty=Number(document.getElementById('w').value);
 const cart=[{id:selected.id,name:selected.name,price:Number(selected.retail),qty,origin:selected.origin||'',supplier:selected.supplier||'',isReal:selected.isReal!==false}];
 localStorage.setItem('bahrna_cart',JSON.stringify(cart));
 localStorage.removeItem('bahrna_orderflow');
 location.href='checkout.html';
}
document.addEventListener('DOMContentLoaded',loadProduct);
</script>
<nav class="mobile-bottom"><a href="home.html">⌂<br>الرئيسية</a><a href="catalog.html">🐟<br>السوق</a><a href="auction.html">🔴<br>المزاد</a><a href="cart.html">🛒<br>السلة</a><a href="login.html">👤<br>حسابي</a></nav>
</body></html>
