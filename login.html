<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحساب</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="app.js"></script></head><body><div class="topbar"><div class="container">🇦🇪 الإمارات • AED • MVP تجريبي</div></div><header class="header"><div class="container header-row"><a class="brand" href="home.html"><span class="brand-mark">⛵🐟</span><div>بحرنا وشراعنا<br><small>BAHRNA & SHRAANA</small></div></a><div class="search"><input placeholder="ابحث عن سمك، مورد، منتج..."></div><nav class="navlinks"><a href="catalog.html">الأسماك الطازجة</a><a href="auction.html">المزادات</a><a href="register.html">الشركات</a><a href="login.html">حسابي</a></nav></div></header><section class="section"><div class="container grid2"><div class="card"><h2>تسجيل الدخول</h2><div class="field"><label>البريد</label><input id="liEmail" type="email"></div><div class="field"><label>كلمة المرور</label><input id="liPass" type="password"></div><button class="btn btn-primary" onclick="login()">دخول</button></div><div class="card"><h2>إنشاء حساب مجاني</h2><div class="field"><label>الاسم</label><input id="suName"></div><div class="field"><label>البريد</label><input id="suEmail" type="email"></div><div class="field"><label>كلمة المرور</label><input id="suPass" type="password"></div><button class="btn btn-gold" onclick="signup()">إنشاء الحساب</button><p id="msg" class="muted"></p></div></div></section><script>async function signup(){try{await Bahrna.signUp(suEmail.value,suPass.value,suName.value);msg.textContent='تم إنشاء الحساب. تحقق من بريدك إذا كان التأكيد مفعلاً.'}catch(e){msg.textContent=e.message}}async function login(){try{await Bahrna.signIn(liEmail.value,liPass.value);const r=localStorage.getItem('bahrna_return_after_login')||'home.html';localStorage.removeItem('bahrna_return_after_login');location.href=r}catch(e){alert(e.message)}}</script><nav class="mobile-bottom"><a href="home.html">⌂<br>الرئيسية</a><a href="catalog.html">🐟<br>السوق</a><a href="auction.html">🔴<br>المزاد</a><a href="checkout.html">🛒<br>السلة</a><a href="login.html">👤<br>حسابي</a></nav></body></html>
