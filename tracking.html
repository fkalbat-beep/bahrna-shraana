<!doctype html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    تتبع الطلب
  </title>

  <link
    rel="stylesheet"
    href="app.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script src="config.js"></script>

  <script
    defer
    src="app.js">
  </script>

  <script
    defer
    src="order_delivery.js">
  </script>

</head>


<body>


<div class="topbar">

  <div class="container">

    🇦🇪 الإمارات • AED • تتبع الطلب

  </div>

</div>


<header class="header">

  <div class="container header-row">


    <a
      class="brand"
      href="home.html"
    >

      <span class="brand-mark">
        ⛵🐟
      </span>


      <div>

        بحرنا وشراعنا

        <br>

        <small>
          BAHRNA & SHRAANA
        </small>

      </div>

    </a>


    <div style="margin-right:auto">

      <a
        class="btn btn-gold"
        href="catalog.html"
      >

        السوق

      </a>

    </div>


  </div>

</header>



<section class="section">

  <div class="container">


    <div class="card">


      <h1>

        تتبع الطلب

        <span id="trackOrderNo">
        </span>

      </h1>



      <div class="tracking-line">


        <div class="track-steps">


          <div class="track-step">

            <div class="track-dot">
              1
            </div>

            <span>
              تم التأكيد
            </span>

          </div>



          <div class="track-step">

            <div class="track-dot">
              2
            </div>

            <span>
              جاري التجهيز
            </span>

          </div>



          <div class="track-step">

            <div class="track-dot">
              3
            </div>

            <span>
              خرج للتوصيل
            </span>

          </div>



          <div class="track-step">

            <div class="track-dot">
              4
            </div>

            <span>
              تم التسليم
            </span>

          </div>


        </div>

      </div>



      <h2 id="currentStatus">
        جاري تحميل حالة الطلب...
      </h2>


      <p
        class="muted"
        id="trackingNote"
      >

        يتم جلب آخر حالة للطلب.

      </p>



      <button
        id="simulateBtn"
        class="btn btn-primary"
        onclick="advanceTracking()"
        style="display:none"
      >

        محاكاة الانتقال للمرحلة التالية

      </button>


    </div>


  </div>

</section>


</body>

</html>
