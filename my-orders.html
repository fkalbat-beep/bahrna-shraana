<!doctype html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>طلباتي | بحرنا وشراعنا</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script src="config.js"></script>

  <script defer src="app.js"></script>

  <script defer src="my-orders.js"></script>

</head>


<body>


<div class="topbar">

  <div class="container">

    🇦🇪 الإمارات • AED • حسابي

  </div>

</div>


<header class="header">

  <div class="container header-row">


    <a
      class="brand"
      href="home.html"
    >

      <span class="brand-mark">
        ⛵🐟
      </span>


      <div>

        بحرنا وشراعنا

        <br>

        <small>
          BAHRNA & SHRAANA
        </small>

      </div>

    </a>


    <div style="margin-right:auto">

      <a
        class="btn btn-gold"
        href="catalog.html"
      >
        السوق
      </a>

    </div>


  </div>

</header>


<section class="section">

  <div class="container">


    <div
      class="admin-top"
      style="margin-bottom:20px"
    >

      <div>

        <h1
          style="margin:0;color:var(--navy)"
        >
          طلباتي
        </h1>

        <p class="muted">

          جميع طلباتك وحالتها الحالية.

        </p>

      </div>

    </div>


    <div class="card">


      <div
        id="ordersLoading"
        class="muted"
      >

        جاري تحميل الطلبات...

      </div>


      <div
        id="noOrders"
        style="display:none;text-align:center;padding:30px"
      >

        <div style="font-size:48px">
          🛒
        </div>

        <h2>
          لا توجد طلبات حتى الآن
        </h2>

        <p class="muted">
          عند إتمام أول طلب سيظهر هنا تلقائياً.
        </p>

        <a
          href="catalog.html"
          class="btn btn-gold"
        >
          تصفح السوق
        </a>

      </div>


      <div
        id="ordersWrap"
        style="display:none;overflow-x:auto"
      >

        <table class="table">

          <thead>

            <tr>

              <th>
                رقم الطلب
              </th>

              <th>
                المنتجات
              </th>

              <th>
                التاريخ
              </th>

              <th>
                القيمة
              </th>

              <th>
                الحالة
              </th>

              <th>
                التتبع
              </th>

            </tr>

          </thead>


          <tbody id="myOrderRows">
          </tbody>

        </table>

      </div>


    </div>


  </div>

</section>


<nav class="mobile-bottom">

  <a href="home.html">
    ⌂
    <br>
    الرئيسية
  </a>

  <a href="catalog.html">
    🐟
    <br>
    السوق
  </a>

  <a href="auction.html">
    🔴
    <br>
    المزاد
  </a>

  <a href="my-orders.html">
    📦
    <br>
    طلباتي
  </a>

  <a href="login.html">
    👤
    <br>
    حسابي
  </a>

</nav>


</body>

</html>
